<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#EDEDED">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>我的日记</title>
<style>
/* ============================================================
   设计令牌：默认浅色（仿微信朋友圈），data-theme="dark" 切换深色
   ============================================================ */
:root{
  --bg:#EDEDED;
  --shell:#D8D8D8;
  --card:#FFFFFF;
  --nav:#EDEDED;
  --ink:#2E4A63;
  --ink-tint:rgba(46,74,99,.09);
  --text:#191919;
  --text-strong:#000000;
  --link:#576B95;
  --sub:#B2B2B2;
  --line:#E5E5E5;
  --green:#07C160;
  --green-press:#06AD56;
  --danger:#FA5151;
  --mask:rgba(0,0,0,.45);
  --fill:#F2F2F2;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --bg:#0F0F0F;
  --shell:#000000;
  --card:#1C1C1E;
  --nav:#0F0F0F;
  --ink:#9FB6CB;
  --ink-tint:rgba(159,182,203,.13);
  --text:#EDEDED;
  --text-strong:#FFFFFF;
  --link:#7D90B8;
  --sub:#7A7A7E;
  --line:#2A2A2C;
  --mask:rgba(0,0,0,.65);
  --fill:#2A2A2C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:#C9C9C9;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:0;background:none;padding:0;color:inherit;cursor:pointer}
img{display:block}
input,textarea{font-family:inherit}

/* 容器：窄屏铺满，大屏一列，超宽屏改左侧栏布局（见文件末尾响应式段） */
#app{
  position:relative;margin:0 auto;background:var(--bg);
  width:100%;height:100dvh;overflow:hidden;
}
@media (min-width:520px){
  body{background:var(--shell)}
  #app{max-width:600px;box-shadow:0 0 0 1px var(--line)}
}

/* ---------------- 通用：页面容器 ---------------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.screen.page{z-index:5;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);visibility:hidden}
.screen.page.active{transform:translateX(0);visibility:visible}
/* 标签面板：同层级切换，不做滑入动画（区别于 page） */
.screen.pane{z-index:1;display:none}
.screen.pane.active{display:flex}

/* ---------------- 导航栏 ---------------- */
.nav{
  flex:none;position:relative;height:46px;display:flex;align-items:center;
  padding:0 6px;padding-top:var(--safe-t);background:var(--nav);
  border-bottom:.5px solid var(--line);z-index:3;
}
/* 左上返回键：图标贴左缘（约 16px 处），但保留 44×44 的触控热区 */
.nav-btn.nav-back{justify-content:flex-start;padding-left:10px}
.nav-btn.nav-back svg{flex:none}
.nav-title{
  position:absolute;left:50%;top:var(--safe-t);transform:translateX(-50%);
  height:46px;line-height:46px;font-size:17px;font-weight:600;color:var(--text-strong);
  white-space:nowrap;pointer-events:none;
}
.nav-btn{
  height:44px;min-width:44px;padding:0 10px;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--text);gap:4px;border-radius:6px;
}
.nav-btn:active{opacity:.5}
.nav-btn.right{margin-left:auto}
.nav-btn.link-green{color:var(--green);font-weight:500}
.nav-btn[disabled]{color:var(--sub);pointer-events:none}
/* 长按相机时的按压反馈（.post.pressing 那套是给卡片的，这里给导航按钮补一个） */
.nav-btn.pressing{opacity:.45}
/* 相机按钮要接住 pointer 长按手势：不给 touch-action，iOS 的 WebKit 会在手指稍微一动时
   把这次手势判给滚动、发个 pointercancel 过来，长按就断了（安卓上一般不会，但写了也无害）。 */
#btnCamera{touch-action:none}
.nav-btn svg{display:block}
/* hidden 属性要压得住 .nav-btn 的 display:flex，否则「返回首页」藏不起来 */
.nav-btn[hidden]{display:none}

/* ---------------- 滚动区 ---------------- */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/**
 * 时间线的滚动区：**必须关掉浏览器自带的 overscroll**（contain）。
 * 原因：现在下拉放大封面这件事完全由 JS 手势接管（见 bindPullToTop）。
 * 如果同时放开原生回弹，安卓 12+ 的拉伸 / iOS 的橡皮筋会再动一遍整页，
 * 两个位移叠在一起会「飘」，手感完全不是微信那种。
 * —— 之前误判过一次：以为 contain 是"下拉没反应"的原因，
 *    其实当时压根没有自定义下拉逻辑，光靠原生回弹自然什么都没有。
 */
#homeScroll{overscroll-behavior-y:contain}

/* ---------------- 首页：朋友圈式封面 ---------------- */
/* transform-origin 定在「顶部居中」：下拉放大时上边缘钉住不动，只向下、向两侧长，
   配合下面 JS 的 translateY(-d) 就能严丝合缝填满下拉时露出的那块空白。
   左右超出部分由 .scroll 的 overflow-x:hidden 裁掉，看起来就是朋友圈那种"图片被放大"。 */
.cover{position:relative;height:250px;background:linear-gradient(150deg,#3C4A5E 0%,#5A6B82 45%,#8797A8 100%);overflow:hidden;cursor:pointer;transform-origin:center top;backface-visibility:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
/* 这层只是压暗，必须让点击穿过去 —— 否则它铺满整块，把封面的点击全吃掉了，
   下面的「点封面看大图」永远触发不了。 */
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.32));pointer-events:none}
.cover-add{
  position:absolute;right:12px;top:12px;z-index:2;color:#fff;font-size:12px;
  background:rgba(0,0,0,.28);padding:4px 9px;border-radius:14px;
  /* iOS 的 WKWebView 只认带前缀的写法，少写一行 iPhone 上毛玻璃就没了（安卓/Chrome 两种都认） */
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.cover-add:active{opacity:.6}
.cover-shade{position:absolute;left:0;right:0;bottom:0;height:78px;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.45));z-index:1}
.me{
  position:relative;margin-top:-44px;padding:0 14px 14px;background:var(--card);
  display:flex;align-items:flex-start;gap:12px;z-index:2;
}
.me-avatar{
  width:66px;height:66px;border-radius:8px;flex:none;margin-top:-22px;
  border:3px solid var(--card);background:#8E8E93;overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.me-avatar img{width:100%;height:100%;object-fit:cover}
.me-info{flex:1;min-width:0;padding-top:4px}
.me-name{font-size:17px;font-weight:600;color:var(--text-strong);line-height:1.3}
.me-sign{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.4;word-break:break-all}
.me-stat{font-size:12px;color:var(--sub);margin-top:7px}

/* ---------------- 日记卡片（朋友圈动态块） ---------------- */
.timeline{background:var(--card);min-height:200px}
.year-divider{
  padding:8px 14px;font-size:13px;color:var(--sub);background:var(--card);
  border-top:.5px solid var(--line);position:sticky;top:0;z-index:2;
}
[data-theme="dark"] .year-divider{background:#1C1C1E}
.post{
  display:flex;gap:10px;padding:14px;background:var(--card);
  border-bottom:.5px solid var(--line);position:relative;
}
.post.pressing{background:var(--fill)}
.post-avatar{
  width:42px;height:42px;border-radius:6px;flex:none;overflow:hidden;background:#8E8E93;
}
.post-avatar img{width:100%;height:100%;object-fit:cover}
.post-avatar .avatar-letter{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;font-weight:600;background:linear-gradient(135deg,#4A7A9B,#3B5A73);
}
.post-main{flex:1;min-width:0}
.post-name{font-size:16px;font-weight:500;color:var(--link);line-height:1.2;margin-bottom:5px}
/* 换行由 TextFmt.toHtml() 显式转成的 <br> 负责，这里绝不能再开 pre-wrap ——
   否则源码里的换行符 + <br> 会各渲染一次，行距被翻倍，正文看起来"多空了一行"。
   用 normal 让文本流自己合并空白，只有 <br> 决定换行，各端表现一致。 */
.post-text{
  font-size:16px;line-height:1.5;color:var(--text);white-space:normal;
  word-break:break-word;letter-spacing:.2px;
}
/* 折叠态：CSS 限制行数，iOS/Android WebView 与新版 Chrome 都支持 -webkit-line-clamp。
   行数走变量，由 JS 用 POST_FOLD_LINES 写进 :root —— 免得两边各写一个 6，改一处漏一处。 */
.post-text.folded{
  display:-webkit-box;-webkit-line-clamp:var(--post-fold-lines,6);-webkit-box-orient:vertical;
  overflow:hidden;position:relative;
}
/* 末尾一层渐隐，暗示"下面还有内容"，比硬切自然 */
.post-text.folded::after{
  content:"";position:absolute;right:0;bottom:0;width:56px;height:1.5em;
  background:linear-gradient(90deg,rgba(0,0,0,0),var(--card) 62%);
  pointer-events:none;
}
.post-text.expanded{display:block;overflow:visible}
/* 微信式「更多 / 收起」：整行左侧、绿色链接色，不用按钮样式 */
.post-moretext{
  display:block;text-align:left;margin-top:4px;font-size:15px;
  color:var(--link);line-height:1.7;padding:0;
}
.post-moretext span{font-size:12.5px;color:var(--sub);margin-left:2px}
.post-moretext:active{opacity:.55}
.post-moretext.on{color:var(--sub)}
.post-foot{
  display:flex;align-items:center;gap:8px;margin-top:8px;min-height:22px;
}
.post-time{font-size:12.5px;color:var(--sub)}
.post-lock{display:flex;align-items:center;color:var(--sub);opacity:.85}
.post-more{
  margin-left:auto;width:34px;height:24px;display:flex;align-items:center;justify-content:center;
  border-radius:4px;background:var(--fill);color:var(--sub);gap:2px;
}
.post-more:active{opacity:.55}
.post-more .dot{width:3px;height:3px;border-radius:50%;background:currentColor}

/* 九宫格图片 */
.pgrid{display:grid;gap:4px;margin-top:8px}
.pgrid.n1{grid-template-columns:1fr;max-width:210px}
.pgrid.n2{grid-template-columns:repeat(2,1fr);max-width:176px}
.pgrid.n4{grid-template-columns:repeat(2,1fr);max-width:176px}
.pgrid.n3,.pgrid.n5,.pgrid.n6,.pgrid.n7,.pgrid.n8,.pgrid.n9{grid-template-columns:repeat(3,1fr);max-width:232px}
.pgrid .ph{
  width:100%;aspect-ratio:1;border-radius:3px;overflow:hidden;background:var(--fill);
  position:relative;display:block;animation:fadeIn .25s ease both;
}
.pgrid.n1 .ph{aspect-ratio:1}
.pgrid .ph img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 空状态 */
.empty{padding:70px 30px;text-align:center;background:var(--card)}
.empty svg{margin:0 auto 18px;display:block;opacity:.9}
.empty h3{font-size:16px;font-weight:500;color:var(--text);margin:0 0 8px}
.empty p{font-size:13.5px;color:var(--sub);line-height:1.7;margin:0}
.empty-hint{
  margin:0 14px 14px;padding:14px 16px;border-radius:10px;background:var(--card);
  font-size:12.5px;color:var(--sub);line-height:1.7;
}
.empty-hint b{color:var(--text);font-weight:500}

/* 时间线底部提示 */
.tl-end{padding:22px 14px calc(30px + var(--safe-b));text-align:center;font-size:12.5px;color:var(--sub);background:var(--card)}

/* 下拉回弹（微信手势）：跟手期间由 JS 写 transform（下面 data-pulling 只是提性能），
   松手后靠这段过渡把「整体位移」和「封面放大」一起弹回原位。
   缓动特意带一点过冲（cubic-bezier 的 y 超过 1），松手那一下才有 QQ 弹弹的手感。 */
/* 时间线内容层：下拉手势位移的就是它（不是滚动区），常态不需要任何样式，
   只在跟手时挂 will-change 提一下性能，省得整页都常驻一个合成层。 */
.tl-pull{position:relative}
.tl-pull[data-pulling]{will-change:transform}
.tl-pull[data-pulling] .cover{will-change:transform}
/* 松手后的收放过渡（和 JS 里 380ms 的清理定时器对齐）：
   缓动的 y 分量超过 1，回弹时会有一点点过冲，手感更接近微信。 */
.tl-pull.springing,.cover.springing{transition:transform .36s cubic-bezier(.22,1.35,.36,1)}
/* 头像 / 背景可点：给一点按压反馈，让人知道它们能点 */
.me-avatar,.cover{cursor:pointer}
.me-avatar:active{opacity:.85}

/* ---------------- 发布页 ---------------- */
.composer-body{flex:1;overflow-y:auto;padding:14px 14px calc(24px + var(--safe-b));background:var(--card)}
#composerText{
  width:100%;min-height:130px;max-height:46vh;border:0;outline:none;resize:none;
  font-size:17px;line-height:1.55;color:var(--text);background:transparent;padding:0;
}
#composerText::placeholder{color:var(--sub)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.cgrid .cell{
  position:relative;aspect-ratio:1;border-radius:5px;overflow:hidden;background:var(--fill);
  display:flex;align-items:center;justify-content:center;
}
.cgrid .cell img{width:100%;height:100%;object-fit:cover}
.cgrid .cell .del{
  position:absolute;top:0;right:0;width:24px;height:24px;background:rgba(0,0,0,.55);
  border-bottom-left-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;
}
.cgrid .cell .del:active{opacity:.6}
.cgrid .add{
  border:1px dashed var(--line);color:var(--sub);flex-direction:column;gap:6px;
  font-size:12px;background:transparent;
}
.cgrid .add:active{background:var(--fill)}
.counter{text-align:right;font-size:12px;color:var(--sub);margin-top:10px}
.counter.warn{color:var(--danger)}
.composer-tip{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:20px;padding-top:14px;border-top:.5px solid var(--line)}

/* ---------------- 通用：底部操作面板 ---------------- */
.mask{
  position:fixed;inset:0;background:var(--mask);z-index:120;opacity:0;pointer-events:none;
  transition:opacity .22s ease;
}
.mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:8px;right:8px;bottom:calc(8px + var(--safe-b));
  background:var(--card);border-radius:12px;overflow:hidden;
  transform:translateY(120%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.mask.show .sheet{transform:translateY(0)}
.sheet-item{
  height:52px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:16.5px;color:var(--text);border-bottom:.5px solid var(--line);width:100%;
}
.sheet-item:last-child{border-bottom:0}
.sheet-item:active{background:var(--fill)}
.sheet-item.danger{color:var(--danger)}
.sheet-item.cancel{margin-top:8px;border-radius:12px;background:var(--card);font-weight:500}

/* 对话框 */
.dialog{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);
  width:272px;background:var(--card);border-radius:12px;overflow:hidden;text-align:center;
  transition:transform .2s ease;
}
.mask.show .dialog{transform:translate(-50%,-50%) scale(1)}
.dialog-title{font-size:17px;font-weight:500;color:var(--text-strong);padding:22px 20px 0}
/* 同 .post-text：换行只交给内容里的 <br>，这里不开 pre-wrap，避免换行被算两次 */
.dialog-text{font-size:14px;color:var(--sub);line-height:1.6;padding:9px 20px 20px;
  white-space:normal;word-break:break-word;max-height:46vh;overflow-y:auto}
.dialog-btns{display:flex;border-top:.5px solid var(--line)}
.dialog-btns button{
  flex:1;height:50px;font-size:16.5px;color:var(--text);
}
.dialog-btns button+button{border-left:.5px solid var(--line)}
.dialog-btns button:active{background:var(--fill)}
.dialog-btns .danger{color:var(--danger)}
.dialog-btns .primary{color:var(--green);font-weight:500}

/* ---------------- 图片查看器 ---------------- */
.viewer{
  position:fixed;inset:0;background:#000;z-index:80;display:none;flex-direction:column;
  /* 横向裁剪放在这一层：轨道里的其它页会被推出视口，需要裁掉。
     注意**不能**把这个 overflow 放到 .viewer-track 上（见下方轨道的注释）。 */
  overflow:hidden;
}
.viewer.show{display:flex}
.viewer-top{
  flex:none;height:calc(48px + var(--safe-t));padding-top:var(--safe-t);
  display:flex;align-items:center;padding-left:6px;padding-right:14px;color:#fff;z-index:2;
}
.viewer-count{font-size:14px;opacity:.9;margin:0 auto}
/* ⚠️ 轨道上**绝对不能**加 overflow:hidden —— 这是踩过的坑：
   实测（translateX 逐档测试）只要轨道带 overflow:hidden，位移到约 -50% 之后，
   整棵子树就**同时失去命中测试和绘制**：滑到第 2 张后再也收不到 touchstart
   （表现为"只能翻一次、之后卡住"），截图也因为落在两张图之间的空隙而是纯黑。
   横向裁剪交给外层 .viewer（它已有 overflow:hidden），轨道保持默认 visible。 */
.viewer-track{flex:1;display:flex;align-items:center;transition:transform .26s cubic-bezier(.3,.7,0,1);touch-action:none}
.viewer-track .slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;padding:0 6px}
.viewer-track .slide img{
  max-width:100%;max-height:100%;object-fit:contain;border-radius:2px;
  /* ⚠️ max-height 百分比不能单独用：查看器里 .viewer-track 是 flex:1 的轨道，
     实测（844x390 横屏）会出现轨道高度=图片内容高度(624px) > 视口(390px) 的情况，
     此时 img 的 100% 参照的是那个撑大的父盒，图片就溢出屏幕了。
     所以高度再用视口单位钉一次 —— 查看器是全屏的，100vh 减掉顶栏就是确定值。 */
  max-height:calc(100vh - var(--viewer-top, 48px) - var(--safe-t) - var(--safe-b) - 4px);
  /* 缩放由 JS 写 transform（translate 居中 + scale）；will-change 让合成层提前就位，
     否则 iOS 上双指缩放的每一帧都要重新栅格化，肉眼可见地掉帧。 */
  transform-origin:center center;will-change:transform;
}
/* 放大后单指拖动应该是「看图片的其余部分」，而不是左右翻页；
   这里只负责光标反馈，是否翻页由 JS 依据当前缩放值决定。 */
.viewer-track .slide img.zoomed{cursor:grab}
.viewer-track .slide img.zoomed:active{cursor:grabbing}

/* ---------------- 锁屏 ---------------- */
#screen-lock{
  z-index:100;background:#161A1F;
  background-image:radial-gradient(circle at 20% 12%,rgba(80,120,160,.35),transparent 55%),
                   radial-gradient(circle at 82% 82%,rgba(60,90,120,.32),transparent 55%);
  color:#fff;align-items:center;justify-content:center;display:none;
}
#screen-lock.show{display:flex}
.lock-inner{width:100%;max-width:300px;padding:0 24px;display:flex;flex-direction:column;align-items:center}
.lock-icon{
  width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;
}
.lock-title{font-size:17px;font-weight:500;letter-spacing:.5px}
.lock-sub{font-size:13px;color:rgba(255,255,255,.6);margin-top:8px;text-align:center;line-height:1.6;min-height:20px}
.lock-dots{display:flex;gap:16px;margin:26px 0 6px;height:14px}
.lock-dots i{
  width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);
  transition:background .15s,transform .15s;
}
.lock-dots i.on{background:#fff;border-color:#fff;transform:scale(1.05)}
.lock-dots.shake{animation:shake .38s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(3px)}
}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:0;width:100%;margin-top:14px}
.keypad button{
  height:62px;font-size:25px;font-weight:300;color:#fff;display:flex;
  align-items:center;justify-content:center;border-radius:50%;margin:0 auto;width:64px;
  transition:background .12s;
}
.keypad button:active{background:rgba(255,255,255,.18)}
.keypad .blank{pointer-events:none}
.keypad .fn{font-size:15px;font-weight:400;color:rgba(255,255,255,.75);width:auto;padding:0 12px}
.lock-foot{margin-top:26px;display:flex;gap:26px}
.lock-foot button{font-size:13.5px;color:rgba(255,255,255,.62);padding:8px}
.lock-foot button:active{opacity:.6}

/* ---------------- 设置页 ---------------- */
.set-group{margin-top:10px;background:var(--card)}
.set-group-title{font-size:13px;color:var(--sub);padding:14px 16px 8px}
.set-row{
  display:flex;align-items:center;gap:12px;min-height:54px;padding:9px 16px;
  border-bottom:.5px solid var(--line);width:100%;text-align:left;
}
/* .set-row 自带 display:flex 会把 hidden 属性的 UA 样式（display:none）压掉 ——
   和 .nav-btn 踩过的是同一个坑。「关闭密码」行靠 hidden 收放，没这条它会
   在密码删掉之后还挂在页面上（截图里亲眼见过的 bug）。 */
.set-row[hidden]{display:none}
.set-group .set-row:last-child{border-bottom:0}
.set-row:active{background:var(--fill)}
.set-label{font-size:16px;color:var(--text);flex:none}
.set-value{
  margin-left:auto;font-size:15px;color:var(--sub);max-width:56%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.set-row.danger .set-label{color:var(--danger)}
.set-arrow{flex:none;color:var(--sub);opacity:.7}
.set-input{
  margin-left:auto;border:0;outline:none;background:transparent;text-align:right;
  font-size:15px;color:var(--text);width:60%;border-bottom:1px solid transparent;
}
.set-input:focus{border-bottom-color:var(--green)}
.switch{
  margin-left:auto;width:51px;height:31px;border-radius:16px;background:#DDD;
  position:relative;transition:background .2s;flex:none;
}
[data-theme="dark"] .switch{background:#3A3A3C}
.switch i{
  position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s;
}
.switch.on{background:var(--green)}
.switch.on i{transform:translateX(20px)}
.set-note{font-size:12.5px;color:var(--sub);line-height:1.7;padding:12px 16px;background:var(--card)}
.storage-bar{height:5px;border-radius:3px;background:var(--fill);overflow:hidden;margin:8px 16px 0;display:none}
.storage-bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}

/* ============================================================
   封面页：品牌入口（标题 / 进入按钮 / 简洁背景）
   ============================================================ */
#screen-cover{
  z-index:140;position:absolute;inset:0;display:none;overflow:hidden;
  align-items:center;justify-content:center;
  background:#141C24;color:#F2F5F8;
  transition:opacity .55s ease,transform .55s ease;
}
#screen-cover.show{display:flex}
#screen-cover.leaving{opacity:0;transform:scale(1.05);pointer-events:none}
/* 背景一层：极淡的斜向方格，呼应「纸／本」的秩序感 */
#screen-cover::before{
  content:"";position:absolute;inset:-25%;
  background-image:linear-gradient(rgba(255,255,255,.042) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.042) 1px,transparent 1px);
  background-size:36px 36px;transform:rotate(-7deg);
}
/* 背景二层：两处柔和光晕，上半冷蓝、底部品牌绿 */
#screen-cover::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 72% 52% at 50% 26%,rgba(120,160,200,.22),transparent 72%),
             radial-gradient(ellipse 66% 46% at 50% 104%,rgba(7,193,96,.13),transparent 72%);
}
.cover-inner{
  position:relative;z-index:2;width:100%;max-width:380px;padding:0 34px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.cover-mark{
  width:58px;height:58px;border-radius:19px;margin-bottom:28px;
  background:rgba(255,255,255,.09);border:.5px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
}
.cover-title{
  margin:0;font-size:33px;font-weight:600;line-height:1.25;
  letter-spacing:9px;text-indent:9px;
}
.cover-sub{margin:14px 0 0;font-size:13.5px;letter-spacing:2.5px;color:rgba(242,245,248,.6)}
.cover-rule{width:46px;height:1px;background:rgba(255,255,255,.26);margin:28px 0}
.cover-meta{margin:0;font-size:13px;line-height:1.9;color:rgba(242,245,248,.55)}
.cover-meta b{color:#fff;font-weight:500}
/* 自动进入的进度条：一条 1.8 秒走完的细线，让"停一下就进去"这件事看起来是刻意的 */
.cover-auto{
  margin-top:34px;width:132px;height:2px;border-radius:2px;overflow:hidden;
  background:rgba(255,255,255,.16);
}
.cover-auto-bar{
  display:block;height:100%;width:0;border-radius:2px;background:#fff;opacity:.75;
}
.cover-auto-bar.run{animation:coverAuto 1.8s linear forwards}
@keyframes coverAuto{from{width:0}to{width:100%}}
.cover-enter-hint{
  margin:13px 0 0;font-size:12px;letter-spacing:1.2px;color:rgba(242,245,248,.4);
  animation:coverHint 1.8s ease-in-out infinite;
}
@keyframes coverHint{0%,100%{opacity:.45}50%{opacity:.85}}
/* 整页可点：想快点进去就点一下，不需要精确命中某个按钮 */
#screen-cover{cursor:default}
#screen-cover .cover-tap{position:absolute;inset:0;z-index:1}
.cover-foot{
  position:absolute;left:0;right:0;bottom:calc(26px + var(--safe-b));z-index:2;
  text-align:center;font-size:12px;letter-spacing:.6px;color:rgba(242,245,248,.34);
}
/* 想回到"必须手动点击"的老行为：把「启动时显示封面页」关掉即可，
   或在这里把动画时长改长、把 enterApp 的定时器去掉 */
@media (prefers-reduced-motion:reduce){
  .cover-auto-bar.run{animation-duration:1.8s}
  .cover-enter-hint{animation:none}
}
@media (min-width:900px){
  .cover-title{font-size:40px}
  .cover-inner{max-width:460px}
}

/* ============================================================
   主导航：窄屏底部标签栏 / ≥900px 左侧导航栏
   ============================================================ */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:4;
  display:flex;align-items:stretch;
  background:var(--nav);border-top:.5px solid var(--line);
  padding-bottom:var(--safe-b);
}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px 0 6px;color:var(--sub);font-size:11px;line-height:1;
  transition:color .15s;
}
.tabbar .tab svg{display:block}
.tabbar .tab.on{color:var(--green)}
.tabbar .tab:active{opacity:.55}
.tabbar .brand{display:none}

/* 悬浮「写日记」按钮（层级低于 .screen.page，打开发布页时自动让位） */
.fab{
  position:absolute;right:16px;bottom:calc(68px + var(--safe-b));z-index:3;
  width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(7,193,96,.4);
  transition:transform .16s,background .16s;
}
.fab:active{transform:scale(.93);background:var(--green-press)}

/* 标签面板统一留出导航占位 */
.screen.pane{padding-bottom:calc(50px + var(--safe-b))}
.screen.pane .scroll{overscroll-behavior:contain}
/* 启动决策完成前不显示任何面板，避免封面页出现前闪一下主界面 */
#app.booting .screen.pane{display:none}

/* ============================================================
   首页
   ============================================================ */
.desk-inner{padding:20px 16px 96px;max-width:1040px;margin:0 auto;width:100%}
.desk-hello{margin:6px 4px 22px}
.desk-date{font-size:13px;color:var(--sub);letter-spacing:.4px}
.desk-greet{font-size:23px;font-weight:600;color:var(--text-strong);margin:9px 0 0;letter-spacing:.3px}
.desk-sub{font-size:13px;color:var(--sub);margin:10px 0 0;line-height:1.6}
.desk-primary{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  padding:18px 18px;border-radius:16px;background:var(--green);color:#fff;
  box-shadow:0 6px 18px rgba(7,193,96,.26);
  transition:transform .16s,box-shadow .16s;
}
.desk-primary:active{transform:scale(.985);box-shadow:0 3px 10px rgba(7,193,96,.2)}
.desk-primary .dp-ico{
  width:44px;height:44px;border-radius:13px;flex:none;
  background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;
}
.desk-primary .dp-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.desk-primary .dp-text b{font-size:16.5px;font-weight:500;letter-spacing:.3px}
.desk-primary .dp-text i{font-size:12.5px;font-style:normal;opacity:.82}
.desk-primary .dp-arrow{flex:none;opacity:.75}

.tiles{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;
}
.tile{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;
  padding:16px 6px 13px;border-radius:16px;background:var(--card);
  transition:transform .16s,background .16s;
}
.tile:active{transform:scale(.97);background:var(--fill)}
/* 图标样式规范：46px 圆角底 + 22px 线性图标（1.7 描边、圆头圆角），全局统一墨蓝主色 */
.tile-ico{
  width:46px;height:46px;border-radius:14px;background:var(--ink-tint);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
}
.tile-label{font-size:12.5px;color:var(--text);letter-spacing:.2px}
.tile-badge{
  position:absolute;top:11px;right:11px;min-width:19px;height:19px;padding:0 5px;
  border-radius:10px;background:var(--green);color:#fff;font-size:11px;line-height:19px;
  text-align:center;
}
.tile-badge:empty,.tile-badge[data-zero="1"]{display:none}

.desk-recent{margin-top:18px;border-radius:16px;background:var(--card);overflow:hidden}
.dr-head{
  display:flex;align-items:center;padding:15px 18px 12px;
  font-size:13px;color:var(--sub);letter-spacing:.3px;
}
.dr-head button{margin-left:auto;font-size:13px;color:var(--green)}
.dr-body{display:flex;gap:13px;padding:0 18px 18px}
.dr-thumb{
  width:58px;height:58px;border-radius:11px;flex:none;background:var(--fill);overflow:hidden;
}
.dr-thumb img{width:100%;height:100%;object-fit:cover}
.dr-text{flex:1;min-width:0}
.dr-excerpt{
  font-size:14.5px;line-height:1.55;color:var(--text);margin:2px 0 8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.dr-meta{font-size:12px;color:var(--sub)}
.dr-empty{padding:0 18px 20px;font-size:13.5px;color:var(--sub);line-height:1.7}

/* ============================================================
   相册
   ============================================================ */
.gal-inner{padding:16px 14px 96px;max-width:1040px;margin:0 auto;width:100%}
.pane-head{display:flex;align-items:baseline;gap:10px;padding:6px 4px 16px}
.pane-head h2{font-size:20px;font-weight:600;color:var(--text-strong);margin:0}
.pane-head span{font-size:13px;color:var(--sub);margin-left:auto}
.gal-month{margin-bottom:20px}
.gal-month-title{font-size:13px;color:var(--sub);margin:0 4px 9px;letter-spacing:.4px}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.gal-grid a{aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--fill);display:block}
.gal-grid img{width:100%;height:100%;object-fit:cover;display:block}

/* ============================================================
   搜索
   ============================================================ */
.search-bar{
  flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;
  border-radius:17px;background:var(--fill);color:var(--sub);
}
.search-bar input{
  flex:1;border:0;outline:none;background:transparent;font-size:15px;color:var(--text);min-width:0;
}
.search-bar input::placeholder{color:var(--sub)}
.search-hit{padding:15px 16px;background:var(--card);border-bottom:.5px solid var(--line)}
.search-hit:active{background:var(--fill)}
.search-hit mark{background:rgba(7,193,96,.22);color:inherit;border-radius:3px;padding:0 1px}
.search-hit .sh-text{font-size:15px;line-height:1.55;color:var(--text)}
.search-hit .sh-meta{font-size:12px;color:var(--sub);margin-top:7px}
.search-tip{padding:64px 30px;text-align:center;font-size:13.5px;color:var(--sub);line-height:1.8}

/* ============================================================
   统计
   ============================================================ */
.stat-inner{padding:18px 16px 30px;max-width:1040px;margin:0 auto;width:100%}
.stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-card{padding:18px 14px;border-radius:16px;background:var(--card);text-align:center}
.stat-num{font-size:26px;font-weight:600;color:var(--text-strong);line-height:1.15}
.stat-num small{font-size:13px;font-weight:400;color:var(--sub);margin-left:2px}
.stat-cap{font-size:12.5px;color:var(--sub);margin-top:8px}
.chart-card{margin-top:14px;padding:18px 16px 14px;border-radius:16px;background:var(--card)}
.chart-title{font-size:13.5px;color:var(--text);margin:0 0 16px;display:flex}
.chart-title span{margin-left:auto;color:var(--sub);font-size:12.5px}
.bars{display:flex;align-items:flex-end;gap:6px;height:132px}
.bar-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:100%}
.bar{
  width:100%;max-width:26px;border-radius:5px 5px 3px 3px;background:var(--ink-tint);
  min-height:3px;transition:height .4s cubic-bezier(.4,0,.2,1);
}
.bar.has{background:var(--green)}
.bar-num{font-size:10.5px;color:var(--sub);height:13px;line-height:13px}
.bar-cap{font-size:11px;color:var(--sub)}
.stat-rows{margin-top:14px;border-radius:16px;background:var(--card);overflow:hidden}
.stat-row{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:.5px solid var(--line);font-size:14.5px;
}
.stat-rows .stat-row:last-child{border-bottom:0}
/* 左名目 + 右数值：名目固定色、数值加重，长名目不换行 */
.stat-row .sr-label{color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-row .sr-value{
  margin-left:auto;flex:none;font-weight:500;color:var(--text-strong);font-size:15px;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.stat-row .sr-value i{font-style:normal;font-size:12.5px;font-weight:400;color:var(--sub);margin-left:1px}
.stat-note{margin-top:14px;font-size:12px;color:var(--sub);text-align:center;line-height:1.7}
@media (min-width:900px){
  .stat-rows{display:grid;grid-template-columns:repeat(2,1fr)}
  /* 双列时右列首行也要有上边框，否则看着像少一条 */
  .stat-rows .stat-row{border-bottom:.5px solid var(--line)}
  .stat-rows .stat-row:nth-child(odd){border-right:.5px solid var(--line)}
  .stat-rows .stat-row:nth-last-child(-n+2){border-bottom:0}
}

/* 跳转定位后的高亮 */
@keyframes hlFade{0%{background:rgba(7,193,96,.14)}100%{background:transparent}}
.post.hl{animation:hlFade 1.8s ease-out both}

/* ============================================================
   Toast
   ============================================================ */
#toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,12px);
  background:rgba(0,0,0,.82);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:8px;
  max-width:78%;text-align:center;line-height:1.5;z-index:200;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   响应式：≥900px 切换为「左侧导航栏 + 主内容区」的宽屏骨架
   ============================================================ */
@media (min-width:900px){
  #app{max-width:none;box-shadow:none}
  .tabbar{
    top:0;bottom:0;left:0;right:auto;width:84px;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:6px;
    border-top:0;border-right:.5px solid var(--line);
    background:var(--card);padding:calc(16px + var(--safe-t)) 0 18px;
  }
  .tabbar .brand{
    display:flex;width:40px;height:40px;border-radius:13px;margin-bottom:16px;
    background:#1E2B38;color:#fff;align-items:center;justify-content:center;flex:none;
  }
  .tabbar .tab{
    flex:none;width:64px;height:56px;border-radius:13px;gap:5px;font-size:11px;
  }
  .tabbar .tab.on{background:rgba(7,193,96,.1);color:var(--green)}
  @media (hover:hover){.tabbar .tab:hover{background:var(--fill)}}
  .fab{left:14px;right:auto;bottom:20px;width:56px;height:56px;position:absolute}

  .screen.pane{padding-bottom:0;padding-left:84px}
  .desk-inner,.gal-inner,.stat-inner{padding:30px 34px 40px}

  /* 宽屏档：磁贴 6 列一行放完，与最近记录并排 */
  .desk-body{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
  .tiles{grid-template-columns:repeat(3,1fr);gap:12px;margin-top:0}
  .desk-primary{margin-bottom:14px}
  .desk-recent{margin-top:14px}
  .gal-grid{grid-template-columns:repeat(6,1fr);gap:7px}
  .stat-cards{grid-template-columns:repeat(3,1fr)}
  .bars{height:158px}

  /* 时间线在宽屏档收成居中的阅读列 */
  #screen-timeline .scroll > *{max-width:720px;margin-left:auto;margin-right:auto}
  #screen-timeline .cover{height:300px;border-radius:14px;margin-top:28px;overflow:hidden}
  #screen-timeline .me{border-radius:0}
  #screen-timeline .timeline{border-radius:0 0 14px 14px;overflow:hidden}
  #screen-timeline .empty{border-radius:0 0 14px 14px}
  #screen-timeline .empty-hint{border-radius:14px}
  .screen.page{padding-left:84px}
  #screen-composer .composer-body{max-width:720px;margin:0 auto;width:100%}
}

/* 极窄屏（<340px）微调，避免磁贴文字挤压 */
@media (max-width:339px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .stat-cards{grid-template-columns:1fr}
  .cover-title{font-size:27px;letter-spacing:6px}
}

/* ============================================================
   横屏（手机竖屏旋转为横屏）
   ------------------------------------------------------------
   横屏的问题不在宽度，而在**高度**：竖屏专用的一堆固定高度
   （封面 250px、导航 46px、底部标签栏 50px+）在横屏里会把
   只剩 ~390px 的高度吃掉大半，正文区被挤成一条缝。
   所以这一段的核心只有一件事：把竖向占用的高度整体压下来。
   用 max-height:520px 把平板/桌面排除在外 —— 它们横屏高度足够，
   套上这套压缩规则反而会变得小气。
   ============================================================ */
@media (orientation:landscape) and (max-height:520px){
  /* 铺满整宽：横屏的目的就是想要更多空间，而 520px 那条「平板」规则会把 #app
     卡在 600px 居中，在 844 宽的手机屏左右各留 122px 灰边，很浪费。
     不会把正文拉得过宽 —— >520px 时时间线本来就会收成居中的阅读列。 */
  body{background:var(--bg)}
  #app{max-width:none;box-shadow:none}

  /* 封面：改成按视口高度取，任何横屏比例下都留得住正文 */
  .cover{height:46vh;min-height:120px;max-height:230px}
  .cover-title{font-size:26px;letter-spacing:5px}
  .cover-sub{font-size:12.5px;margin-top:10px}
  .cover-rule{margin-top:14px}
  .cover-mark{width:46px;height:46px;border-radius:14px}

  /* 导航栏压到 38px；标题行高必须跟着改，否则文字会溢出到栏外 */
  .nav{height:38px}
  .nav-title{height:38px;line-height:38px;font-size:16px}
  .nav-btn{height:38px;min-width:40px}

  /* 底部标签栏：横屏高度太宝贵，图标下不再写文字（被选中项仍靠颜色区分） */
  .tabbar .tab{padding:5px 0 4px;gap:0}
  .tabbar .tab span{display:none}
  .screen.pane{padding-bottom:calc(42px + var(--safe-b))}

  /* 悬浮按钮收小并贴近右下，避免盖住正文 */
  .fab{width:48px;height:48px;right:12px;bottom:calc(56px + var(--safe-b))}

  /* 正文密度：横屏一行能排下更多字，内边距可以小一点 */
  .desk-inner{padding:14px 18px 72px}
  .desk-greet{font-size:20px;margin-top:6px}
  .desk-hello{margin:2px 4px 14px}
  .post-body,.post-text{font-size:15px}

  /* 内容加一个居中上限：@app 放开了 600px 上限之后，844 宽的手机上磁贴会被拉成
     三块巨大的方块（一片绿 + 三个大方块），很失衡。压到 720px 居中即可 ——
     和 >900px 档给时间线的阅读列上限保持一致。 */
  .desk-inner,.gal-inner,.stat-inner{max-width:720px;margin-left:auto;margin-right:auto}
  #settingsScroll > *{max-width:720px;margin-left:auto;margin-right:auto}
  .tiles{max-width:520px}

  /* 锁屏：横屏下键盘和圆点要能同屏放下，收窄并缩小间距 */
  .lock-inner{max-width:340px}
  .lock-icon{width:44px;height:44px;border-radius:13px;margin-bottom:10px}
  .lock-dots{margin:14px 0 4px}
}
</style>
</head>
<body>
<div id="app" class="booting" data-theme="light">

  <!-- ============ 1. 封面页：品牌入口 ============ -->
  <section class="screen" id="screen-cover">
    <div class="cover-inner">
      <div class="cover-mark">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#F2F5F8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.5" y="3.5" width="15" height="17" rx="2.6"/>
          <path d="M8.6 3.5v17"/><path d="M12.2 9.2h4M12.2 13.2h4"/>
        </svg>
      </div>
      <h1 class="cover-title">我的日记</h1>
      <p class="cover-sub">写给自己的日子</p>
      <div class="cover-rule"></div>
      <p class="cover-meta">已记录 <b id="coverCount">0</b> 篇 · 最近更新 <span id="coverLast">暂无</span></p>
      <div class="cover-auto"><span class="cover-auto-bar" id="coverProgress"></span></div>
      <p class="cover-enter-hint">正在进入…（点击可立即进入）</p>
    </div>
    <p class="cover-foot">所有内容仅保存在本机浏览器 · 仅你可见</p>
  </section>

  <!-- ============ 2. 首页 ============ -->
  <section class="screen pane active" id="screen-home">
    <div class="scroll">
      <div class="desk-inner">
        <header class="desk-hello">
          <div class="desk-date" id="deskDate"></div>
          <h1 class="desk-greet" id="deskGreet">你好</h1>
          <p class="desk-sub" id="deskSub">还没有记录，从今天开始吧。</p>
        </header>

        <button class="desk-primary" id="deskWrite">
          <span class="dp-ico">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4.8 19.2l.9-4.2L15.9 4.8a1.9 1.9 0 0 1 2.7 0l.6.6a1.9 1.9 0 0 1 0 2.7L9 18.3z"/>
              <path d="M14.4 6.3l3.3 3.3"/>
            </svg>
          </span>
          <span class="dp-text">
            <b>写点什么</b>
            <i>记录此刻的想法，最多可附 9 张图片</i>
          </span>
          <span class="dp-arrow">
            <svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5 7 7.5l-5.5 6"/></svg>
          </span>
        </button>

        <div class="desk-body">
          <div class="tiles" id="deskTiles">
            <button class="tile" data-go="timeline">
              <span class="tile-ico">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.2h14M4 12h16M4 16.8h10"/></svg>
              </span>
              <span class="tile-label">时间线</span>
              <span class="tile-badge" id="badgeTimeline" data-zero="1">0</span>
            </button>
            <button class="tile" data-go="gallery">
              <span class="tile-ico">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3.6" y="5.2" width="16.8" height="13.6" rx="2.6"/>
                  <circle cx="8.6" cy="9.8" r="1.5"/>
                  <path d="M5 16.6l4.1-4.1 2.9 2.9 2.5-2.5 4.4 4.4"/>
                </svg>
              </span>
              <span class="tile-label">相册</span>
              <span class="tile-badge" id="badgeGallery" data-zero="1">0</span>
            </button>
            <button class="tile" data-go="search">
              <span class="tile-ico">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.6" cy="10.6" r="6"/><path d="M15 15l4.6 4.6"/></svg>
              </span>
              <span class="tile-label">搜索</span>
            </button>
            <button class="tile" data-go="stats">
              <span class="tile-ico">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19.2v-6.4M12 19.2V5M18 19.2v-9.6"/></svg>
              </span>
              <span class="tile-label">统计</span>
            </button>
            <button class="tile" data-go="backup">
              <span class="tile-ico">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 4v10.2"/><path d="M8.2 10.6l3.8 3.8 3.8-3.8"/>
                  <path d="M5 17.6v1.2A1.7 1.7 0 0 0 6.7 20.5h10.6a1.7 1.7 0 0 0 1.7-1.7v-1.2"/>
                </svg>
              </span>
              <span class="tile-label">备份</span>
            </button>
            <button class="tile" data-go="mine" id="tileSettings">
              <span class="tile-ico">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4.6 8.2h14.8M4.6 15.8h14.8"/>
                  <circle cx="9.4" cy="8.2" r="2.3"/><circle cx="14.6" cy="15.8" r="2.3"/>
                </svg>
              </span>
              <span class="tile-label">设置</span>
            </button>
          </div>

          <div class="desk-recent" id="deskRecent"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 3. 时间线（封面 + 动态流） ============ -->
  <section class="screen pane" id="screen-timeline">
    <header class="nav">
      <button class="nav-btn nav-back" id="btnTimelineHome" data-back-home aria-label="返回首页" hidden>
        <svg width="11" height="19" viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 2 9.5l7.5 8"/></svg>
      </button>
      <span class="nav-title">时间线</span>
      <button class="nav-btn right" id="btnCamera" aria-label="写日记">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2a1.5 1.5 0 0 0 1.3-.75l.6-1A1.5 1.5 0 0 1 9.9 3.5h4.2a1.5 1.5 0 0 1 1.3.75l.6 1A1.5 1.5 0 0 0 17.3 6h1.2A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/>
          <circle cx="12" cy="12.5" r="3.4"/>
        </svg>
      </button>
      <button class="nav-btn" id="btnSettings" aria-label="设置">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.05A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.05A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.05V3a2 2 0 1 1 4 0v.05A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.05a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.05a1.7 1.7 0 0 0-1.55 1z"/>
        </svg>
      </button>
    </header>
    <div class="scroll" id="homeScroll">
      <!-- 下拉手势操作的是这一层（内容层），不是滚动区本身。
           直接下移滚动区会把它的上边缘一起带走、在顶部露出背景色；
           移动内容层则上边缘不动，由封面反向 transform + 放大去填满露出的空白。 -->
      <div class="tl-pull" id="tlPull">
        <div class="cover">
          <div class="cover-shade"></div>
          <img id="coverImg" alt="" style="display:none">
          <button class="cover-add" id="btnCover">更换封面</button>
        </div>
        <div class="me">
          <div class="me-avatar" id="meAvatar"></div>
          <div class="me-info">
            <div class="me-name" id="meName">我</div>
            <div class="me-sign" id="meSign"></div>
            <div class="me-stat" id="meStat"></div>
          </div>
        </div>
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
  </section>

  <!-- ============ 4. 相册 ============ -->
  <section class="screen pane" id="screen-gallery">
    <header class="nav">
      <button class="nav-btn nav-back" id="btnGalleryHome" data-back-home aria-label="返回首页" hidden>
        <svg width="11" height="19" viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 2 9.5l7.5 8"/></svg>
      </button>
      <span class="nav-title">相册</span>
    </header>
    <div class="scroll" id="galleryScroll">
      <div class="gal-inner" id="galInner"></div>
    </div>
  </section>

  <!-- ============ 5. 发布 / 编辑页 ============ -->
  <section class="screen page" id="screen-composer">
    <header class="nav">
      <button class="nav-btn nav-back" id="btnCancelCompose" aria-label="返回">
        <svg width="11" height="19" viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 2 9.5l7.5 8"/></svg>
      </button>
      <span class="nav-title" id="composerTitle">写日记</span>
      <button class="nav-btn right link-green" id="btnPublish" disabled>发表</button>
    </header>
    <div class="composer-body">
      <textarea id="composerText" placeholder="这一刻的想法…" maxlength="2000" rows="1"></textarea>
      <div class="cgrid" id="composerGrid"></div>
      <div class="counter" id="composerCounter">0/2000</div>
      <div class="composer-tip" id="composerTip"></div>
    </div>
  </section>

  <!-- ============ 6. 我的（原设置页，改为标签面板） ============ -->
  <section class="screen pane" id="screen-settings">
    <header class="nav">
      <button class="nav-btn nav-back" id="btnMineHome" data-back-home aria-label="返回首页" hidden>
        <svg width="11" height="19" viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 2 9.5l7.5 8"/></svg>
      </button>
      <span class="nav-title">我的</span>
    </header>
    <div class="scroll" id="settingsScroll">

      <div class="set-group-title">个人资料</div>
      <div class="set-group">
        <button class="set-row" id="setAvatar">
          <span class="set-label">头像</span>
          <span class="set-value" id="setAvatarPreview"></span>
          <svg class="set-arrow" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 1.5 7 7.5l-5.5 6"/></svg>
        </button>
        <div class="set-row">
          <span class="set-label">昵称</span>
          <input class="set-input" id="setNickname" maxlength="16" placeholder="我">
        </div>
        <div class="set-row">
          <span class="set-label">签名</span>
          <input class="set-input" id="setSign" maxlength="40" placeholder="写句话给未来的自己">
        </div>
      </div>

      <div class="set-group-title">隐私（仅本人可见）</div>
      <div class="set-group">
        <button class="set-row" id="setLock">
          <span class="set-label">打开时验证密码</span>
          <span class="set-value" id="pinSwitchHint"></span>
          <span class="switch" id="switchLock"><i></i></span>
        </button>
        <button class="set-row" id="setChangePin">
          <span class="set-label" id="pinRowLabel">设置密码</span>
          <span class="set-value" id="pinStateText">未设置</span>
          <svg class="set-arrow" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 1.5 7 7.5l-5.5 6"/></svg>
        </button>
        <button class="set-row danger" id="setClosePin" hidden>
          <span class="set-label">关闭密码</span>
        </button>
        <button class="set-row" id="setAutoLockRow">
          <span class="set-label">离开后自动上锁</span>
          <span class="set-value" id="setAutoLock">1 分钟</span>
          <svg class="set-arrow" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 1.5 7 7.5l-5.5 6"/></svg>
        </button>
      </div>
      <div class="set-note" id="lockNote">密码是可选功能，默认不开启；不设置时打开应用直接进入日记。开启后每次进入都需输入 6 位数字。</div>

      <div class="set-group-title">外观</div>
      <div class="set-group">
        <button class="set-row" id="setTheme">
          <span class="set-label">深色模式</span>
          <span class="switch" id="switchTheme"><i></i></span>
        </button>
        <button class="set-row" id="setCover">
          <span class="set-label">启动时显示封面页</span>
          <span class="switch" id="switchCover"><i></i></span>
        </button>
      </div>

      <div class="set-group-title">数据（本机存储）</div>
      <div class="set-group">
        <button class="set-row" id="setExport">
          <span class="set-label">导出备份</span>
          <span class="set-value" id="exportHint"></span>
          <svg class="set-arrow" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 1.5 7 7.5l-5.5 6"/></svg>
        </button>
        <button class="set-row" id="setImport">
          <span class="set-label">导入备份</span>
          <span class="set-value">JSON · 文本</span>
          <svg class="set-arrow" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 1.5 7 7.5l-5.5 6"/></svg>
        </button>
      </div>
      <div class="set-note" id="storageNote">存储方式：IndexedDB（本地数据库）</div>
      <div class="storage-bar" id="storageBar"><i></i></div>

      <div class="set-group-title">危险操作</div>
      <div class="set-group">
        <button class="set-row danger" id="setClear">
          <span class="set-label">清空全部日记</span>
          <svg class="set-arrow" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 1.5 7 7.5l-5.5 6"/></svg>
        </button>
      </div>
      <div class="set-note">数据只存在于当前浏览器的本地数据库中。清除浏览器数据、更换设备或卸载应用都会导致日记丢失，请定期导出备份。</div>
      <div style="height:40px"></div>
    </div>
  </section>

  <!-- ============ 7. 搜索 ============ -->
  <section class="screen page" id="screen-search">
    <header class="nav">
      <button class="nav-btn nav-back" id="btnSearchBack" aria-label="返回">
        <svg width="11" height="19" viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 2 9.5l7.5 8"/></svg>
      </button>
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.6" cy="10.6" r="6"/><path d="M15 15l4.6 4.6"/></svg>
        <input id="searchInput" type="text" placeholder="搜索日记内容" autocomplete="off" enterkeyhint="search">
        <button id="btnSearchClear" hidden aria-label="清空">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>
    <div class="scroll">
      <div id="searchResults"></div>
    </div>
  </section>

  <!-- ============ 8. 统计 ============ -->
  <section class="screen page" id="screen-stats">
    <header class="nav">
      <button class="nav-btn nav-back" id="btnStatsBack" aria-label="返回">
        <svg width="11" height="19" viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 2 9.5l7.5 8"/></svg>
      </button>
      <span class="nav-title">统计</span>
    </header>
    <div class="scroll">
      <div class="stat-inner" id="statInner"></div>
    </div>
  </section>

  <!-- ============ 9. 主导航：底部标签栏（≥900px 变左侧栏） ============ -->
  <nav class="tabbar" id="tabbar">
    <span class="brand">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.5" y="3.5" width="15" height="17" rx="2.6"/>
        <path d="M8.6 3.5v17"/><path d="M12.2 9.2h4M12.2 13.2h4"/>
      </svg>
    </span>
    <button class="tab on" data-tab="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.8" y="3.8" width="7" height="7" rx="2"/><rect x="13.2" y="3.8" width="7" height="7" rx="2"/>
        <rect x="3.8" y="13.2" width="7" height="7" rx="2"/><rect x="13.2" y="13.2" width="7" height="7" rx="2"/>
      </svg>
      <span>首页</span>
    </button>
    <button class="tab" data-tab="timeline">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.2h14M4 12h16M4 16.8h10"/></svg>
      <span>时间线</span>
    </button>
    <button class="tab" data-tab="gallery">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.6" y="5.2" width="16.8" height="13.6" rx="2.6"/>
        <circle cx="8.6" cy="9.8" r="1.5"/>
        <path d="M5 16.6l4.1-4.1 2.9 2.9 2.5-2.5 4.4 4.4"/>
      </svg>
      <span>相册</span>
    </button>
    <button class="tab" data-tab="mine">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.4" r="3.6"/><path d="M4.9 19.8c0-3.5 3.2-5.7 7.1-5.7s7.1 2.2 7.1 5.7"/>
      </svg>
      <span>我的</span>

<script>
(function () {
'use strict';

/* ==========================================================================
   0. 基础工具层  Util
   ========================================================================== */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
/** 取某时间戳当天 0 点的时间戳（算"相差多少天"必须先把时分秒抹掉，否则会差一天） */
function startOfDay(ts) {
  var d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

/* ==========================================================================
   文本格式化  TextFmt
   关键：textarea 的换行是标准 \n，但用户从别处粘贴进来的可能是 \r\n 或单独的 \r。
   不统一的话，「时间线显示」和「导出的 JSON」会跟用户看到的不一样。
   —— 这是「怎么写的就怎么显示」的唯一入口，展示与导出都走这里。
   ========================================================================== */
var TextFmt = {
  /** 统一换行符：\r\n / \r → \n。入库与展示前都要过一遍 */
  normalize: function (s) { return String(s == null ? '' : s).replace(/\r\n?/g, '\n'); },
  /** 结构信息：行数与是否多行，用于决定要不要显示「更多」 */
  lines: function (s) { return TextFmt.normalize(s).split('\n'); },
  lineCount: function (s) { return TextFmt.lines(s).length; },
  /**
   * 转义成 HTML 并按原文换行显示。
   * 换行**只**由这里的 <br> 负责：容器一律 white-space:normal。
   * 千万不能两边都做（容器再开 pre-wrap 的话，源码换行符和 <br> 会各渲染一次，
   * 行距直接翻倍）；显式 <br> 也比交给 pre-wrap 更可控——部分 Android WebView
   * 对连续空行的折叠规则不一致，转成 <br> 后各端表现统一，也和导出的文本严格对应。
   */
  toHtml: function (s) {
    return escapeHtml(TextFmt.normalize(s)).replace(/\n/g, '<br>');
  },
  /**
   * 折叠信息：超过 n 行就返回完整 HTML + truncated 标记。
   * 注意这里**不裁 HTML** —— 全文都要留在 DOM 里，靠 CSS 的 -webkit-line-clamp 裁显示。
   * 只有这样才能"点更多就展开"：如果渲染时就把后面几行丢掉了，展开时手上根本没有内容可用。
   * hidden 是给「更多（还有 N 行）」文案用的纯数字。
   */
  fold: function (s, n) {
    var all = TextFmt.lines(s);
    var hidden = all.length - n;
    return {
      html: TextFmt.toHtml(s),
      truncated: hidden > 0,
      hidden: hidden > 0 ? hidden : 0
    };
  }
};

var toastTimer = null;
function toast(msg, ms) {
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 1900);
}

/* ==========================================================================
   0.5 原生外壳适配层  Native（Capacitor）
   ---------------------------------------------------------------------------
   用浏览器直接打开 index.html 时 window.Capacitor 不存在，isNative 恒为 false，
   下面所有原生分支一律不生效 —— 网页版行为与打包成 App 之前完全一致。
   打成 Android / iOS 安装包后，原生侧会注入 window.Capacitor，
   并生成 window.Capacitor.Plugins.<插件名> 的代理对象。

var Native = (function () {
  var cap = (typeof window !== 'undefined' && window.Capacitor) || null;
  var plat = (cap && typeof cap.getPlatform === 'function') ? cap.getPlatform() : 'web';
  var isNative = !!(cap && (typeof cap.isNativePlatform === 'function'
    ? cap.isNativePlatform()
    : (plat === 'android' || plat === 'ios')));
  var cache = {};

  /** 取原生插件代理；拿不到返回 null，调用方据此回退到网页实现 */
  function plugin(name) {
    if (!isNative) return null;
    if (name in cache) return cache[name];
    var p = null;
    try {
      if (cap.Plugins && cap.Plugins[name]) p = cap.Plugins[name];
      else if (typeof cap.registerPlugin === 'function') p = cap.registerPlugin({ name: name }) || null;
    } catch (e) { p = null; }
    if (!p) console.warn('[Native] 插件不可用：' + name);
    cache[name] = p;
    return p;
  }

  /**
   * 字符串 → UTF-8 base64。不能直接 btoa(中文)，会抛 InvalidCharacterError。
   *
   * ⚠️ 只做编码工具，**不要**再拿它去配 `Filesystem.writeFile`：
   *    Capacitor 8 的 `Encoding` 枚举里已经没有 base64 了，传 `encoding:'base64'`
   *    会被当成非法值，插件把 base64 字符串原样写进文件，谁都解析不出来。
   *    写文本用 `encoding:'utf8'` + 原始字符串即可（见 saveBackupFile）。
   */
  function toBase64(str) {
    var bytes = new TextEncoder().encode(str);
    var CHUNK = 0x8000, out = '';
    for (var i = 0; i < bytes.length; i += CHUNK) {
      out += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));

    return btoa(out);

  /**
   * 插件是否真的可用（**不产生警告**）。
   * 用途：Camera 是可选依赖 —— 没装、或用户还没跑 `npx cap sync` 时，
   * 我们要安静地退回网页实现（<input capture>），而不是每次都往控制台吐一句
   * 「插件不可用」。真要调用时仍然走 plugin()，那时拿不到才有必要警告。
   */
  function hasPlugin(name) {
    if (!isNative) return false;
    try {
      if (cap.Plugins && cap.Plugins[name]) return true;
      return typeof cap.registerPlugin === 'function' && !!cap.registerPlugin({ name: name });
    } catch (e) { return false; }
  }

  return { isNative: isNative, platform: plat, plugin: plugin, hasPlugin: hasPlugin, toBase64: toBase64 };
})();

/* ---------------- 原生：系统返回键 ---------------- */
/**
 * 处理一次「返回」。
 * 优先级：弹层 → 图片查看器 → 锁屏（吃掉，不给退）→ 二级页 → 交还系统（退出 App）。
 * @returns {boolean} true 表示本次返回已被应用消费
 */
function handleBackKey() {
  if ($('#mask').classList.contains('show')) { closeMask(); return true; }
  if ($('#viewer').classList.contains('show')) { closeViewer(); return true; }
  // 锁屏时返回键不生效，避免绕开密码
  if ($('#screen-lock').classList.contains('show')) return true;
  // 二级页复用各自的返回按钮，保证「有草稿要二次确认」等逻辑完全一致
  if ($('#screen-composer').classList.contains('active')) { $('#btnCancelCompose').click(); return true; }
  if ($('#screen-search').classList.contains('active')) { $('#btnSearchBack').click(); return true; }
  if ($('#screen-stats').classList.contains('active')) { $('#btnStatsBack').click(); return true; }
  // 从首页磁贴跳进的标签页：返回键回首页，而不是直接把 App 退掉
  // （从底部栏切进来的不拦，保持"再按一次退出"的老行为）
  if (State.tab !== 'home' && State.tabVia === 'tile') { switchTab('home', 'tab'); return true; }
  return false;
}

/** 绑定系统返回键（仅 App 内生效；不注册的话 Capacitor 会直接退出应用） */
function bindNativeBackButton() {
  if (!Native.isNative) return;
  var App = Native.plugin('App');
  if (!App || !App.addListener) return;
  App.addListener('backButton', function () {
    if (!handleBackKey() && App.exitApp) App.exitApp();
  });
}

/* ---------------- 原生：拍照过程中 App 被回收后恢复 ---------------- */
/**
 * 相机是**独立 Activity**：它在前台时本 App 可能被系统回收（低内存 / 后台太久）。
 * 插件官方要求监听 appRestoredResult 才能把那次拍照的结果找回来 ——
 * 不接这个监听，用户拍完回来会看到照片凭空消失（更糟的是连相机返回的回调也没了）。
 * 这里在 store 就绪后再把恢复下来的照片补进发布页。
 */
function bindNativeCameraRestore(onReady) {
  if (!Native.isNative || !Native.hasPlugin('Camera')) return;
  var App = Native.plugin('App');
  if (!App || !App.addListener) return;
  App.addListener('appRestoredResult', function (data) {
    if (!data || data.pluginId !== 'Camera' || !data.success || !data.data) return;
    onReady(function () {
      photoBlob(data.data).then(function (blob) {
        if (!blob) return;
        openComposer(null);
        // 同样不能用 addImages(...).then()：它**任何分支都不返回 Promise**
        // （正常路径也是隐式 undefined），链式调用必崩（踩过两次）。
        var outcome = addCameraDraftImage(blob);
        toast(outcome.ok ? '已找回拍照时的照片' : ('已找回拍照时的照片。' + outcome.toast));
      }).catch(function (e) { console.warn('[Camera] 恢复拍照结果失败', e); });
    });
  });
}

/* ---------------- 原生：状态栏跟随主题 ---------------- */
/** 把当前主题同步给系统状态栏，否则深色下状态栏图标会看不见 */
function syncNativeStatusBar(dark) {
  if (!Native.isNative) return;
  var StatusBar = Native.plugin('StatusBar');
  if (!StatusBar) return;
  try {
    // Capacitor 的语义：DARK = 深色背景配浅色图标，LIGHT = 浅色背景配深色图标
    if (StatusBar.setStyle) StatusBar.setStyle({ style: dark ? 'DARK' : 'LIGHT' });
    if (StatusBar.setBackgroundColor) StatusBar.setBackgroundColor({ color: dark ? '#0F0F0F' : '#EDEDED' });
  } catch (e) { /* 部分机型 / API 35+ 边到边模式下设置背景色会被忽略，不影响功能 */ }
}

/* ---------------- 原生：备份文件落盘 ---------------- */
/**
 * 保存备份。
 * 浏览器：<a download> + Blob URL。
 * App 内：<a download> 在 Android WebView 里不生效，改为写入缓存目录后调起系统分享面板
 *         （可存到「文件」、发微信、传电脑）。
 *
 * ⚠️ 编码参数只能写 utf8。Capacitor 8 的 `Encoding` 枚举**只剩 utf8 / ascii / utf16**，
 *    以前那个 `Encoding.BASE64` 已经被移除了 —— 传 `encoding:'base64'` 属于非法值，
 *    插件不认，就把字符串**原样按文本写盘**，结果是「.json 文件里其实是 base64 文本」，
 *    用任何解析器都读不出内容（用户看到的就是一堆乱码，以为备份里不是自己的日记）。
 *    要写字符串就 `encoding:'utf8'` + 原始文本，别再做 base64 往返。
 */
function saveBackupFile(fileName, text, mime) {
  if (!Native.isNative) {
    var blob = new Blob([text], { type: mime || 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return Promise.resolve('download');
  }
  var Filesystem = Native.plugin('Filesystem');
  var Share = Native.plugin('Share');
  if (!Filesystem || !Share) return Promise.reject(new Error('原生文件插件未就绪'));
  return Filesystem.writeFile({
    path: fileName,
    data: text,
    directory: 'CACHE',
    encoding: 'utf8',
    recursive: true
  }).then(function (res) {
    return Share.share({
      title: '我的日记备份',
      text: fileName,
      url: res.uri,
      dialogTitle: '保存或分享备份文件'
    });
  }).then(function () { return 'share'; });
}

/* ==========================================================================
   1. 时间格式化层  TimeFmt
   规则（仿朋友圈）：刚刚 / N分钟前 / 今天 HH:mm / 昨天 HH:mm / M月D日 HH:mm / YYYY年M月D日
   ========================================================================== */
var TimeFmt = {
  rel: function (ts) {
    var d = new Date(ts), now = new Date();
    var diff = now.getTime() - ts;
    if (diff < 60 * 1000) return '刚刚';
    if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + '分钟前';
    var sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return '今天 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    var y = new Date(now.getTime() - 86400000);
    if (d.toDateString() === y.toDateString()) return '昨天 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    if (d.getFullYear() === now.getFullYear()) {
      return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  },
  full: function (ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
      ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  },
  /** 用于「今天/昨天」之外的日期分组比较 */
  dayKey: function (ts) {
    var d = new Date(ts);
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }
};

/* ==========================================================================
   2. 图片处理层  ImageProc
   职责：读取文件 -> 按最长边缩放 -> canvas 转 JPEG Blob（大幅降低存储体积）
   ========================================================================== */
var ImageProc = {
  MAX_SIDE: 1600,
  QUALITY: 0.82,

  readFile: function (file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(fr.error || new Error('读取失败')); };
      fr.readAsDataURL(file);
    });
  },

  loadImage: function (src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('图片解码失败')); };
      img.src = src;
    });
  },

  /** 等比压缩；GIF/PNG 透明会转白底输出 JPEG */
  compress: function (file) {
    var self = this;
    return this.readFile(file).then(function (dataUrl) {
      return self.loadImage(dataUrl).then(function (img) {
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;
        var scale = Math.min(1, self.MAX_SIDE / Math.max(w, h));
        var tw = Math.max(1, Math.round(w * scale));
        var th = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = tw; canvas.height = th;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, tw, th);
        ctx.drawImage(img, 0, 0, tw, th);
        return new Promise(function (resolve) {
          canvas.toBlob(function (blob) {
            // canvas 不可用或压缩无收益时，退回原文件
            if (!blob) {
              resolve({ blob: file, w: w, h: h, size: file.size });
            } else {
              resolve({ blob: blob, w: tw, h: th, size: blob.size });
            }
          }, 'image/jpeg', self.QUALITY);
        });
      });
    });
  },

  blobToDataURL: function (blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(fr.error); };
      fr.readAsDataURL(blob);
    });
  },

  dataURLToBlob: function (dataUrl) {
    var parts = String(dataUrl).split(',');
    var mime = (parts[0].match(/:(.*?);/) || [, 'image/jpeg'])[1];
    var bin = atob(parts[1] || '');
    var len = bin.length;
    var u8 = new Uint8Array(len);
    for (var i = 0; i < len; i++) u8[i] = bin.charCodeAt(i);
    return new Blob([u8], { type: mime });
  },

  fmtSize: function (bytes) {
    if (!bytes) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  }
};

/* ==========================================================================
   3. 存储层  Store
   设计：IndexedDB 为唯一数据源（entries / images 两个对象仓库），
        若 IndexedDB 不可用（如部分浏览器的 file:// 策略、隐私模式）自动降级到
        localStorage（图片转 dataURL，容量受限，界面上会给出提示）。
   对外暴露统一的异步 API，上层不感知后端差异。
   ========================================================================== */
var Store = (function () {
  var DB_NAME = 'wechat-diary';
  var DB_VER = 1;
  var LS_PREFIX = 'wd_';
  var backend = null;
  var mode = 'idb';          // 'idb' | 'local'
  var memFallback = null;    // localStorage 也不可用时的内存兜底

  /* ---------- IDB 辅助 ---------- */
  function openIDB() {
    return new Promise(function (resolve, reject) {
      if (!window.indexedDB) return reject(new Error('no-indexeddb'));
      var req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return reject(e); }
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('entries')) {
          var es = db.createObjectStore('entries', { keyPath: 'id' });
          es.createIndex('createdAt', 'createdAt', { unique: false });
        }
        if (!db.objectStoreNames.contains('images')) {
          var is = db.createObjectStore('images', { keyPath: 'id' });
          is.createIndex('entryId', 'entryId', { unique: false });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('idb-error')); };
      req.onblocked = function () { reject(new Error('idb-blocked')); };
    });
  }
  function reqP(r) {
    return new Promise(function (res, rej) {
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function txDone(t) {
    return new Promise(function (res, rej) {
      t.oncomplete = function () { res(); };
      t.onerror = function () { rej(t.error); };
      t.onabort = function () { rej(t.error || new Error('abort')); };
    });
  }

  var idbBackend = {
    db: null,
    init: function () { var self = this; return openIDB().then(function (db) { self.db = db; }); },
    listEntries: function () {
      var t = this.db.transaction('entries', 'readonly');
      return reqP(t.objectStore('entries').getAll());
    },
    putEntry: function (e) {
      var t = this.db.transaction('entries', 'readwrite');
      t.objectStore('entries').put(e);
      return txDone(t);
    },
    deleteEntry: function (id) {
      var t = this.db.transaction('entries', 'readwrite');
      t.objectStore('entries').delete(id);
      return txDone(t);
    },
    getImage: function (id) {
      var t = this.db.transaction('images', 'readonly');
      return reqP(t.objectStore('images').get(id));
    },
    putImage: function (rec) {
      var t = this.db.transaction('images', 'readwrite');
      t.objectStore('images').put(rec);
      return txDone(t);
    },
    deleteImage: function (id) {
      var t = this.db.transaction('images', 'readwrite');
      t.objectStore('images').delete(id);
      return txDone(t);
    },
    listImages: function () {
      var t = this.db.transaction('images', 'readonly');
      return reqP(t.objectStore('images').getAll());
    },
    /** 只清空日记及其图片，保留封面 / 头像等个人资料图 */
    clear: function () {
      var db = this.db;
      return reqP(db.transaction('images', 'readonly').objectStore('images').getAll()).then(function (imgs) {
        var t = db.transaction(['entries', 'images'], 'readwrite');
        var ents = t.objectStore('entries');
        var imgs2 = t.objectStore('images');
        return new Promise(function (resolve, reject) {
          t.oncomplete = function () { resolve(); };
          t.onerror = function () { reject(t.error); };
          ents.clear();
          (imgs || []).forEach(function (r) {
            if (r.entryId !== '__profile__') imgs2.delete(r.id);
          });
        });
      });
    }
  };

  /* ---------- localStorage 降级实现 ---------- */
  function lsGet(k, dft) {
    try {
      var v = localStorage.getItem(LS_PREFIX + k);
      return v == null ? dft : JSON.parse(v);
    } catch (e) { return dft; }
  }
  function lsSet(k, v) {
    try { localStorage.setItem(LS_PREFIX + k, JSON.stringify(v)); return true; }
    catch (e) { return false; }
  }
  var localBackend = {
    init: function () {
      try { localStorage.setItem(LS_PREFIX + '__t', '1'); localStorage.removeItem(LS_PREFIX + '__t'); }
      catch (e) { throw new Error('no-storage'); }
      return Promise.resolve();
    },
    listEntries: function () { return Promise.resolve(lsGet('entries', [])); },
    putEntry: function (e) {
      var list = lsGet('entries', []);
      var i = list.findIndex(function (x) { return x.id === e.id; });
      if (i >= 0) list[i] = e; else list.push(e);
      return lsSet('entries', list) ? Promise.resolve() : Promise.reject(new Error('quota'));
    },
    deleteEntry: function (id) {
      var list = lsGet('entries', []).filter(function (x) { return x.id !== id; });
      return lsSet('entries', list) ? Promise.resolve() : Promise.reject(new Error('quota'));
    },
    getImage: function (id) {
      var rec = lsGet('img_' + id, null);
      if (!rec) return Promise.resolve(null);
      rec.blob = ImageProc.dataURLToBlob(rec.data);
      return Promise.resolve(rec);
    },
    putImage: function (rec) {
      var self = this;
      return ImageProc.blobToDataURL(rec.blob).then(function (dataUrl) {
        var ok = lsSet('img_' + rec.id, { id: rec.id, entryId: rec.entryId, w: rec.w, h: rec.h, size: rec.size, data: dataUrl });
        return ok ? undefined : Promise.reject(new Error('quota'));
      });
    },
    deleteImage: function (id) {
      try { localStorage.removeItem(LS_PREFIX + 'img_' + id); } catch (e) {}
      return Promise.resolve();
    },
    listImages: function () {
      var out = [], keys = [];
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf(LS_PREFIX + 'img_') === 0) keys.push(k);
        }
      } catch (e) {}
      keys.forEach(function (k) {
        try { out.push(JSON.parse(localStorage.getItem(k))); } catch (e) {}
      });
      return Promise.resolve(out);
    },
    clear: function () {
      var keys = [];
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (!k) continue;
          var isProfile = (k === LS_PREFIX + 'img_cover' || k === LS_PREFIX + 'img_avatar');
          if (!isProfile && (k.indexOf(LS_PREFIX + 'img_') === 0 || k === LS_PREFIX + 'entries')) keys.push(k);
        }
      } catch (e) {}
      keys.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
      lsSet('entries', []);
      return Promise.resolve();
    }
  };

  return {
    get mode() { return mode; },

    init: function () {
      return openIDB().then(function (db) {
        idbBackend.db = db;
        backend = idbBackend;
        mode = 'idb';
      }).catch(function () {
        return localBackend.init().then(function () {
          backend = localBackend;
          mode = 'local';
        }).catch(function () {
          // 最后兜底：纯内存（本次会话有效，刷新即丢）
          var mem = { entries: [], images: {} };
          backend = {
            init: function () { return Promise.resolve(); },
            listEntries: function () { return Promise.resolve(mem.entries.slice()); },
            putEntry: function (e) {
              var i = mem.entries.findIndex(function (x) { return x.id === e.id; });
              if (i >= 0) mem.entries[i] = e; else mem.entries.push(e);
              return Promise.resolve();
            },
            deleteEntry: function (id) {
              mem.entries = mem.entries.filter(function (x) { return x.id !== id; });
              return Promise.resolve();
            },
            getImage: function (id) { return Promise.resolve(mem.images[id] || null); },
            putImage: function (r) { mem.images[r.id] = r; return Promise.resolve(); },
            deleteImage: function (id) { delete mem.images[id]; return Promise.resolve(); },
            listImages: function () { return Promise.resolve(Object.keys(mem.images).map(function (k) { return mem.images[k]; })); },
            clear: function () { mem.entries = []; mem.images = {}; return Promise.resolve(); }
          };
          mode = 'memory';
        });
      });
    },

    /* ---------- 日记条目 ---------- */
    listEntries: function () {
      return backend.listEntries().then(function (list) {
        return (list || []).sort(function (a, b) { return b.createdAt - a.createdAt; });
      });
    },
    getEntry: function (id) {
      return backend.listEntries().then(function (list) {
        return (list || []).filter(function (e) { return e.id === id; })[0] || null;
      });
    },
    saveEntry: function (entry) { return backend.putEntry(entry); },
    /** 删除日记：先级联删除它拥有的图片，再删除条目本身 */
    deleteEntryCascade: function (id) {
      return backend.listImages().then(function (imgs) {
        var owned = (imgs || []).filter(function (r) { return r.entryId === id; });
        return Promise.all(owned.map(function (r) {
          if (urlCache.has(r.id)) {
            try { URL.revokeObjectURL(urlCache.get(r.id)); } catch (e) {}
            urlCache.delete(r.id);
          }
          return backend.deleteImage(r.id);
        }));
      }).then(function () { return backend.deleteEntry(id); });
    },

    /* ---------- 图片 ---------- */
    putImage: function (rec) { return backend.putImage(rec); },
    getImage: function (id) { return backend.getImage(id); },
    /** 删除单张图片并释放它的 Blob URL */
    deleteImage: function (id) {
      if (urlCache.has(id)) {
        try { URL.revokeObjectURL(urlCache.get(id)); } catch (e) {}
        urlCache.delete(id);
      }
      return backend.deleteImage(id);
    },
    listImages: function () { return backend.listImages(); },
    clearAll: function () { return backend.clear(); },

    /* ---------- 估算占用 ---------- */
    /**
     * 图片字节 + 日记文字字节。
     * 文字也要算：一篇只有文字、没有配图的日记，占用不该显示成 0。
     * 注意 profile 图（封面/头像）在后端的 clear() 里是**故意保留**的，
     * 所以"清空全部日记"之后这里的数字通常不会变成 0，而是回落到只剩资料图的大小。
     */
    usage: function () {
      return Promise.all([backend.listImages(), backend.listEntries()]).then(function (res) {
        var bytes = 0;
        (res[0] || []).forEach(function (r) {
          if (r.size) bytes += r.size;
          else if (r.data) bytes += r.data.length * 0.75;
          else if (r.blob) bytes += r.blob.size || 0;
        });
        (res[1] || []).forEach(function (e) {
          try { bytes += JSON.stringify(e).length; } catch (err) { /* 循环引用等异常不影响进度 */ }
        });
        return bytes;
      });
    }
  };
})();

/* ==========================================================================
   5. 密码层  Lock
   仅做本地校验：SHA-256( salt + pin )，无网络、无账号，忘记只能重置（清空数据）
   ========================================================================== */
var Lock = {
  /* 简易同步哈希（crypto.subtle 不可用时兜底） */
  weakHash: function (str) {
    var h1 = 0x811c9dc5, h2 = 0x1000193;
    for (var i = 0; i < str.length; i++) {
      h1 = (h1 ^ str.charCodeAt(i)) * 16777619 >>> 0;
      h2 = ((h2 << 5) - h2 + str.charCodeAt(i)) >>> 0;
    }
    return ('0000000' + h1.toString(16)).slice(-8) + ('0000000' + h2.toString(16)).slice(-8);
  },
  hash: function (pin, salt) {
    var text = salt + ':' + pin;
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      var buf = new TextEncoder().encode(text);
      return window.crypto.subtle.digest('SHA-256', buf).then(function (dg) {
        return Array.prototype.map.call(new Uint8Array(dg), function (b) {
          return ('0' + b.toString(16)).slice(-2);
        }).join('');
      }).catch(function () { return Lock.weakHash(text); });
    }
    return Promise.resolve(Lock.weakHash(text));
  },
  makeSalt: function () {
    if (window.crypto && window.crypto.getRandomValues) {
      var a = new Uint8Array(8);
      window.crypto.getRandomValues(a);
      return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    }
    return uid() + uid();
  },
  verify: function (pin) {
    var m = Meta.data;
    if (!m.pinHash) return Promise.resolve(false);
    return this.hash(pin, m.pinSalt).then(function (h) { return h === m.pinHash; });
  },
  setPin: function (pin) {
    var salt = this.makeSalt();
    var self = this;
    return this.hash(pin, salt).then(function (h) {
      Meta.save({ pinSalt: salt, pinHash: h, pinEnabled: true });
    });
  }
};
