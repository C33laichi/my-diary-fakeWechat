  /* --- 图片查看器 ---
     手势分两条路，靠当前缩放值分流：
       · 未放大 → 单指左右拖动翻页（和改之前完全一样的手感）
       · 已放大 → 单指拖动平移图片，图片拖到头了才允许翻页
     缩放本身支持：双指捏合（触摸）、滚轮（桌面）、双击（触摸与鼠标通用）。
     touch-action:none 写在 .viewer-track 上，否则浏览器会把双指手势抢去滚页面。 */
  var vTrack = $('#viewerTrack');
  var ZOOM_MAX = 6;                 // 最大放大倍数，再大就糊成马赛克了
  var V_TAP = 10, V_TOGGLE = 2.5;   // 判定「点」而非「拖」的位移阈值 / 双击放大到的倍数
  var vScale = 1, vTx = 0, vTy = 0; // 当前缩放与平移
  var vPanning = false;             // 已放大时，本次手势是在拖图片
  var vLastTap = 0;
  var vPinch = null, vPinchScale = 1, vPinchTx = 0, vPinchTy = 0;
  var vSx = 0, vSy = 0, vTx0 = 0, vTy0 = 0, vDragging = false;
  var vLastX = 0, vLastY = 0, vLastDx = 0, vMoved = 0;

  var vImg = function (i) { return $$('#viewerTrack img')[i == null ? State.viewerIndex : i] || null; };

  /**
   * 把缩放状态彻底归零。
   * ⚠️ 必须同时重置 DOM 和下面这堆变量：它们活在本闭包里，**关掉查看器再打开是不会
   *    自动复原的**（openViewerByIds 只是换了 track 的 innerHTML，新的 img 元素天然
   *    没有 transform，可 vScale 还是上次那个值）。踩过的坑：捏合放大到 4.02 关掉、
   *    重开，DOM 看着是 1x，但 vScale=4.02，于是**第一次双击被「取消放大」分支吃掉**，
   *    用户得双击两次才有反应。
   */
  function vClear() {
    vScale = 1; vTx = 0; vTy = 0;
    vDragging = false; vPanning = false; vPinch = null;
    vPinchScale = 1; vPinchTx = 0; vPinchTy = 0;
    vLastDx = 0; vMoved = 0; vLastTap = 0;
    vTx0 = 0; vTy0 = 0;
  }

  function viewerReset() {
    $$('#viewerTrack .slide img').forEach(function (im) {
      im.classList.remove('zoomed');
      im.style.transition = 'none';
      im.style.transform = '';
    });
    vTrack.style.transform = 'translateX(' + (-State.viewerIndex * 100) + '%)';
    vClear();
    State.viewerZoom = 1;
  }
  State.viewerReset = viewerReset;   // 登记给 moveViewer / 旋转重排使用

  $('#viewerClose').addEventListener('click', closeViewer);

  /** 把「围绕中心缩放」换算成 translate：中心不变 → 平移量缩放同倍即可 */
  function vApplyScale(k) {
    vTx = (vTx + vLastX - vTrack.offsetWidth / 2) * k + vTrack.offsetWidth / 2 - vLastX;
    vTy = (vTy + vLastY - vTrack.offsetHeight / 2) * k + vTrack.offsetHeight / 2 - vLastY;
  }

  function vRender(anim) {
    var im = vImg();
    if (!im) return;
    if (vScale <= 1.001) { vScale = 1; vTx = 0; vTy = 0; }   // 归位：不留"差一点点"的放大态
    im.style.transition = anim ? 'transform .22s cubic-bezier(.3,.7,0,1)' : 'none';
    im.style.transform = vScale === 1 ? ''
      : 'translate(' + vTx.toFixed(1) + 'px,' + vTy.toFixed(1) + 'px) scale(' + vScale.toFixed(4) + ')';
    im.classList.toggle('zoomed', vScale > 1);
    State.viewerZoom = vScale;   // 供「3/7 · 2.5x」这类计数展示与旋转重排读取
    updateViewerCount();
  }

  /** 按视图尺寸夹住平移量：图片不会被拖出屏幕留下大片黑边 */
  function vClamp() {
    var im = vImg();
    if (!im || vScale <= 1) { vTx = 0; vTy = 0; return; }
    var tr = vTrack.getBoundingClientRect();   // 查看器真实可视区（含 flex 后的高度）
    var r = im.getBoundingClientRect();        // 含当前 transform，即放大后实际占位
    var mx = Math.max(0, (r.width - tr.width) / 2), my = Math.max(0, (r.height - tr.height) / 2);
    vTx = Math.min(mx, Math.max(-mx, vTx));
    vTy = Math.min(my, Math.max(-my, vTy));
  }

  /** 双击 / 双指点：在 1x 与 2.5x 之间切换 */
  function vToggleZoom(x, y) {
    if (vScale > 1.001) { vScale = 1; vTx = 0; vTy = 0; }
    else { vLastX = x; vLastY = y; vScale = V_TOGGLE; vTx = 0; vTy = 0; vApplyScale(vScale); vClamp(); }
    vRender(true);
  }

  vTrack.addEventListener('touchstart', function (ev) {
    vTrack.style.transition = 'none';
    if (ev.touches.length === 2) {
      vPanning = false; vDragging = false; vPinch = null;
      var b0 = vImg(), r0 = b0 ? b0.getBoundingClientRect() : null;
      vLastX = r0 ? r0.left + r0.width / 2 : vTrack.offsetWidth / 2;
      vLastY = r0 ? r0.top + r0.height / 2 : vTrack.offsetHeight / 2;
      vPinch = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                          ev.touches[0].clientY - ev.touches[1].clientY) || 1;
      vPinchScale = vScale; vPinchTx = vTx; vPinchTy = vTy;
      return;
    }
    if (ev.touches.length !== 1) return;
    vSx = ev.touches[0].clientX; vSy = ev.touches[0].clientY;
    vLastDx = 0; vMoved = 0;
    vDragging = true;
    vPanning = vScale > 1.001;
    if (vPanning) { vTx0 = vTx; vTy0 = vTy; }
  }, { passive: true });

  vTrack.addEventListener('touchmove', function (ev) {
    if (vPinch && ev.touches.length >= 2) {
      var d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                         ev.touches[0].clientY - ev.touches[1].clientY);
      vScale = Math.min(ZOOM_MAX, Math.max(1, vPinchScale * d / vPinch));
      // 以两指中点为焦点缩放：焦点不动 → 焦点之外的距离按缩放比同比放大
      var mx = (ev.touches[0].clientX + ev.touches[1].clientX) / 2;
      var my = (ev.touches[0].clientY + ev.touches[1].clientY) / 2;
      vTx = mx - (mx - vPinchTx) * (vScale / vPinchScale);
      vTy = my - (my - vPinchTy) * (vScale / vPinchScale);
      vLastX = mx; vLastY = my;
      vClamp(); vRender(false);
      return;
    }
    if (!vDragging) return;
    var dx = ev.touches[0].clientX - vSx;
    var dy = ev.touches[0].clientY - vSy;
    vMoved = Math.max(vMoved, Math.abs(dx), Math.abs(dy));
    if (vPanning) {                       // 已放大：拖的是图片本身
      vTx = vTx0 + dx; vTy = vTy0 + dy;
      vClamp(); vRender(false);
      return;
    }
    // 未放大：横向才翻页，纵向交给别的手势（保持原逻辑）
    if (Math.abs(dy) > Math.abs(dx)) { vDragging = false; return; }
    vLastDx = dx;
    vTrack.style.transform = 'translateX(' + (-State.viewerIndex * 100 + dx / vTrack.offsetWidth * 100) + '%)';
  }, { passive: true });

  vTrack.addEventListener('touchend', function (ev) {
    if (vPinch) {
      if (ev.touches.length < 2) {
        vPinch = null;
        if (vScale <= 1.02) { vScale = 1; vTx = 0; vTy = 0; vRender(true); }
      }
      return;
    }
    if (!vDragging) return;
    vDragging = false;
    if (vPanning) {                       // 拖动结束：图片已经在 vClamp 允许的范围内
      if (vMoved < V_TAP) {
        var t = Date.now();
        if (t - vLastTap < 300) { vToggleZoom(ev.changedTouches[0].clientX, ev.changedTouches[0].clientY); vLastTap = 0; }
        else vLastTap = t;
      }
      return;
    }
    vTrack.style.transition = '';
    if (Math.abs(vLastDx) > 50) {
      if (vLastDx < 0 && State.viewerIndex < State.viewerList.length - 1) State.viewerIndex++;
      else if (vLastDx > 0 && State.viewerIndex > 0) State.viewerIndex--;
    }
    moveViewer(State.viewerIndex);
    updateViewerCount();
  }, { passive: true });

  /* 桌面档：滚轮缩放 + 拖拽平移 + 双击切换 */
  vTrack.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var im = vImg();
    if (!im) return;
    var r = im.getBoundingClientRect();
    vLastX = r.left + r.width / 2; vLastY = r.top + r.height / 2;
    var k = ev.deltaY < 0 ? 1.15 : 1 / 1.15;
    var next = Math.min(ZOOM_MAX, Math.max(1, vScale * k));
    vApplyScale(next / vScale);
    vScale = next;
    vClamp(); vRender(false);
  }, { passive: false });

  vTrack.addEventListener('mousedown', function (ev) {
    if (vScale <= 1.001 || ev.target.tagName !== 'IMG') return;
    ev.preventDefault();
    vSx = ev.clientX; vSy = ev.clientY; vTx0 = vTx; vTy0 = vTy;
    function mv(e2) {
      vTx = vTx0 + (e2.clientX - vSx); vTy = vTy0 + (e2.clientY - vSy);
      vClamp(); vRender(false);
    }
    function up() {
      document.removeEventListener('mousemove', mv);
      document.removeEventListener('mouseup', up);
    }
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });

  /* 桌面档的双击统一由原生 dblclick 处理。
     这里**不要**再在 mouseup 里做「点按切换」—— 一次真实双击会先发两组
     mousedown/mouseup 再发 dblclick，两处都接就会切三次（1→2.5→1→2.5），
     双击等于没反应。触摸端的双击检测不受影响：它在 touchend 里，且被 vPanning 门控。 */
  vTrack.addEventListener('dblclick', function (ev) {
    if (ev.target.tagName !== 'IMG') return;
    vToggleZoom(ev.clientX, ev.clientY);
  });

  /* --- 屏幕旋转 / 窗口尺寸变化 ---
     竖屏转横屏时 WebView 只改视口尺寸、不重载页面（AndroidManifest 里
     configChanges 已包含 orientation），所以布局会跟着媒体查询自己变，
     但**查看器里的缩放平移是按旧尺寸算的**，必须重算：
       · 已放大的图片按新视口重新夹取，免得转到横屏后图片被卡在屏幕外
       · 正在编辑的发布页文本框按新高度重新量一次
     延后 260ms：旋转动画期间 innerHeight 还没稳定，立刻量会得到旧值。 */
  function onViewportChange() {
    setTimeout(function () {
      if ($('#viewer').classList.contains('show') && State.viewerReset) State.viewerReset();
      if ($('#screen-composer').classList.contains('active')) autoGrow();
      // 屏幕变宽/变窄会改变正文折行数，折叠判定要跟着重量（签名里含宽度，会自然重算）
      syncPostFold($('#timeline'));
    }, 260);
  }
  window.addEventListener('resize', onViewportChange);
  if (window.screen && window.screen.orientation && window.screen.orientation.addEventListener) {
    window.screen.orientation.addEventListener('change', onViewportChange);
  }
  window.addEventListener('orientationchange', onViewportChange);
  document.addEventListener('keydown', function (ev) {
    if (!$('#viewer').classList.contains('show')) return;
    if (ev.key === 'Escape') closeViewer();
    if (ev.key === 'ArrowRight' && State.viewerIndex < State.viewerList.length - 1) { State.viewerIndex++; moveViewer(State.viewerIndex); updateViewerCount(); }
    if (ev.key === 'ArrowLeft' && State.viewerIndex > 0) { State.viewerIndex--; moveViewer(State.viewerIndex); updateViewerCount(); }
  });

  /* --- 遮罩 --- */
  // 只有「按下点就在遮罩上」的点击才关闭，避免长按弹面板后松手
  // 产生的那次 click（目标已变成新出现的遮罩）把面板立刻关掉
  var maskDownOnSelf = false;
  $('#mask').addEventListener('pointerdown', function (ev) { maskDownOnSelf = (ev.target === this); });
  $('#mask').addEventListener('click', function (ev) {
    if (ev.target === this && maskDownOnSelf) closeMask();
  });

  /* --- 文件选择 --- */
  /* 注意：必须先把 files 拷成真数组，再清 this.value。
     input.value 一被清空，那个 FileList 会**当场变空**（它是活的），
     后面再 slice 就一张都拿不到 —— 症状是"选了图但草稿里没有"。 */
  $('#filePicker').addEventListener('change', function () {
    var files = Array.prototype.slice.call(this.files || []);
    this.value = '';
    var cb = multiCb; multiCb = null;
    if (!files.length) return;   // 用户取消了，什么都不做（也不进发布页）
    if (cb) cb();                // 先开页：openComposer 会把草稿清空
    addImages(files);            // 再把刚选的图压进草稿
  });
  $('#fileCamera').addEventListener('change', function () {
    var files = Array.prototype.slice.call(this.files || []);
    this.value = '';
    var cb = cameraCb; cameraCb = null;
    if (!files.length) return;
    if (cb) cb();
    addImages(files);
  });
  $('#filePickerSingle').addEventListener('change', function () {
    var file = (this.files && this.files[0]) || null;
    this.value = '';
    if (file && singleCb) singleCb(file);
    singleCb = null;
  });

  /* --- 锁屏键盘 --- */
  $('#keypad').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-k]');
    if (!btn) return;
    pinPress(btn.getAttribute('data-k'));
  });
  document.addEventListener('keydown', function (ev) {
    if (!$('#screen-lock').classList.contains('show')) return;
    if (/^[0-9]$/.test(ev.key)) pinPress(ev.key);
    if (ev.key === 'Backspace') pinPress('del');
  });
  /* 锁屏 footer 的三个出口。用「离开时做什么」来区分，而不是靠记哪条入口进来的：
     · setup         → 「暂不设置」/「取消」，什么都不改
     · verify + 关闭入口 → 「关闭密码」删密码、「取消」保持原样
     · verify + 开密码   → 只有「取消」  */
  $('#lockSkip').addEventListener('click', function () {
    // 首次设置时点「暂不设置」：密码是可选功能，不开启验证
    Meta.save({ pinEnabled: false });
    hideLock();
    renderSettings();
    toast('已跳过，密码功能可在「我的 → 打开时验证密码」随时开启');
  });
  // 「取消」：不动任何状态，原样退出。用户看到 "保持开启 / 保持关闭" 的明确反馈，
  // 就不必怀疑自己是不是误操作了（原来这条路上没有任何出口，只能反复输密码）
  $('#lockCancel').addEventListener('click', function () {
    var wasOn = Meta.data.pinEnabled;
    hideLock();
    toast(wasOn ? '已取消，密码验证保持开启' : '已取消');
  });
  // 「关闭密码」：已经站在锁屏上、心里就是要关 —— 现在关掉，不必再输一遍 6 位数字。
  // 密码本体一起清掉（clearPin），标注立刻变「未设置」——用户要的就是"看得见关掉了"。
  $('#lockOff').addEventListener('click', function () {
    clearPin();
    hideLock();
    renderSettings();
    toast('已关闭密码，打开应用将直接进入');
  });
  $('#lockForgot').addEventListener('click', function () {
    openDialog({
      title: '忘记密码',
      text: '日记只保存在本机，密码无法找回。如确认忘记，可清空本地数据后重新开始（已导出的备份文件不受影响）。',
      buttons: [
        { label: '取消' },
        {
          label: '清空数据', style: 'danger', onClick: function () {
            Store.clearAll().then(function () {
              urlCache.forEach(function (u) { URL.revokeObjectURL(u); });
              urlCache.clear();
              clearPin();          // 密码本体 + 开关一起清，彻底回到"未设置"
              hideLock();
              return loadHome();
            }).then(function () { toast('已清空，可重新设置密码'); });
          }
        }
      ]
    });
  });

  /* --- 后台自动上锁 --- */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      State.hiddenAt = Date.now();
    } else if (Meta.data.pinEnabled && Meta.data.pinHash && State.hiddenAt && Meta.data.autoLockSec > 0) {
      if (Date.now() - State.hiddenAt > Meta.data.autoLockSec * 1000) showLock('verify');
      State.hiddenAt = 0;
    }
  });

  /* --- App 内：接管系统返回键（浏览器里是空操作） --- */
  bindNativeBackButton();
}

/* 文件选择辅助
   —— 选择器必须在用户手势里打开，所以「选完再进发布页」这种顺序只能靠回调实现，
      不能先 openComposer 再 .click()（跨了异步就没手势授权了）。 */
var singleCb = null;
var multiCb = null;      // 多选相册：选完之后要做什么（时间线相机的入口用它带出发布页）
var cameraCb = null;     // 拍照：同上
function pickImages(cb) { multiCb = cb || null; $('#filePicker').click(); }
function pickCamera(cb) { cameraCb = cb || null; $('#fileCamera').click(); }
function pickSingle(cb) { singleCb = cb; $('#filePickerSingle').click(); }

/* 长按/更多菜单 */
function openPostMenu(id) {
  var e = State.entries.filter(function (x) { return x.id === id; })[0];
  if (!e) return;
  openSheet([
    { label: '编辑这篇日记', onClick: function () { openComposer(e); } },
    { label: '查看文章详情', onClick: function () { showDetail(e); } },
    {
      label: '删除', danger: true, onClick: function () {
        openDialog({
          title: '删除这篇日记？',
          text: '删除后无法恢复。',
          buttons: [
            { label: '取消' },
            {
              label: '删除', style: 'danger', onClick: function () {
                (e.images || []).forEach(function (i) { urlCache.delete(i); });
                Store.deleteEntryCascade(id).then(function () {
                  return loadHome();
                }).then(function () { toast('已删除'); });
              }
            }
          ]
        });
      }
    }
  ]);
}
/**
 * 查看文章详情。
 * 之前这里用 textContent + \n，而 HTML 会把空白折叠掉 —— 所以时间与正文全挤成一行。
 * 现在统一走 TextFmt.toHtml（转义 + 换行转 <br>），并按"元信息 / 正文"分段，段落之间空一行。
 */
function showDetail(e) {
  var meta = [TimeFmt.full(e.createdAt)];
  if (e.updatedAt) meta.push('修改于 ' + TimeFmt.full(e.updatedAt));
  if (e.images && e.images.length) meta.push('共 ' + e.images.length + ' 张图片');
  meta.push('字数 ' + (e.text ? e.text.length : 0) + ' 字');

  var body = e.text ? TextFmt.normalize(e.text) : '（这篇只有图片）';
  openDialog({
    title: '日记详情',
    text: meta.join('\n') + '\n\n' + body,
    buttons: [{ label: '关闭', style: 'primary' }]
  });
}

/* ==========================================================================
   10. 启动
   流程：封面页 →（仅当自己设过密码时）锁屏验证 → 首页
   密码是可选功能：不设置就直接进日记，想用密码再去「我的 → 打开时验证密码」开启
   ========================================================================== */
/** 封面之后：有密码才验证，没密码直接进首页 */
function afterCover() {
  switchTab('home');
  if (Meta.data.pinEnabled && Meta.data.pinHash) showLock('verify');
}
function boot() {
  Meta.load();
  applyTheme(Meta.data.theme);
  bindEvents();
  bindScrollTopOnNav();
  switchTab('home');
  // 拍照过程中 App 被回收的话，结果要等 store 就绪后再补进发布页。
  // store 没有「就绪」标志可查，所以把「就绪后做什么」作为回调传进去，
  // 在下面 Store.init() 完成后真正执行。
  var pendingRestore = null;
  bindNativeCameraRestore(function (run) { pendingRestore = run; });

  Store.init().then(function () {
    if (Store.mode !== 'idb') {
      toast('当前环境无法使用 IndexedDB，已切换到降级存储', 3200);
    }
    return loadHome();
  }).then(function () {
    if (Meta.data.showCover === false) afterCover();
    else showCover();
    $('#app').classList.remove('booting');
    if (pendingRestore) pendingRestore();
  }).catch(function (err) {
    console.error(err);
    $('#app').classList.remove('booting');
    toast('初始化失败：' + err.message);
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

/* 供控制台调试 / 自动化测试使用 */
window.__diary__ = {
  Store: Store, Meta: Meta, State: State, ImageProc: ImageProc, TimeFmt: TimeFmt, TextFmt: TextFmt, Lock: Lock,
  loadHome: loadHome, switchTab: switchTab, enterApp: enterApp, renderStats: renderStats,
  renderSettings: renderSettings, renderProfile: renderProfile,
  syncTabBack: syncTabBack,
  Native: Native, handleBackKey: handleBackKey, applyTheme: applyTheme,
  showLock: showLock, hideLock: hideLock, exportBackup: exportBackup, confirmExport: confirmExport,
  enableLock: enableLock, disableLock: disableLock, clearPin: clearPin,
  showUnlock: showUnlock, askClosePin: askClosePin, askChangePin: askChangePin,
  pickExportFormat: pickExportFormat, pickImportFormat: pickImportFormat, exportTextBackup: exportTextBackup,
  buildTextBackup: buildTextBackup, parseTextBackup: parseTextBackup, doImportText: doImportText,
  parseBackupText: parseBackupText, importBackup: importBackup,
  showCover: showCover, togglePostText: togglePostText, showDetail: showDetail,
  openDialog: openDialog, closeMask: closeMask, openProfileImage: openProfileImage,
  publishCore: publishCore, buildBackup: buildBackup, backupFileName: backupFileName,
  openComposer: openComposer, renderComposerGrid: renderComposerGrid, addImages: addImages,
  openCameraSheet: openCameraSheet, bindCameraButton: bindCameraButton,
  pickImages: pickImages, pickCamera: pickCamera,
  CAMERA_LONG_MS: CAMERA_LONG_MS, COVER_BASE_H: COVER_BASE_H,
  /**
   * 测试专用：不走输入框，直接以纯文本发一篇**新**日记。
   * 必须强制清掉 editingId —— 否则会覆盖上一篇（编辑态是全局的），把后面的计数断言全带偏。
   */
  publishText: function (text) {
    State.editingId = null;
    State.draftImages = [];
    return publishCore(TextFmt.normalize(text).trim(), []);
  },
  POST_FOLD_LINES: POST_FOLD_LINES, COVER_HOLD_MS: COVER_HOLD_MS
};

})();
</script>
